<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM Branding - Customer Measurement</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:20px;
}
.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}
h2{
    text-align:center;
}
input,textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
}
</style>
</head>

<body>

<div class="container">
<h2>OM Branding</h2>

<input type="text" placeholder="Customer Name">
<input type="tel" placeholder="Mobile Number">
<input type="text" placeholder="Chest">
<input type="text" placeholder="Waist">
<input type="text" placeholder="Shoulder">
<input type="text" placeholder="Sleeve Length">
<input type="text" placeholder="Kurta Length">
<input type="text" placeholder="Pajama Waist">
<input type="text" placeholder="Pajama Length">

<textarea rows="5" placeholder="Notes / Alteration"></textarea>

<button>Save Customer</button>

</div>

</body>
</html>
